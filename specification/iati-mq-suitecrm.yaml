---
asyncapi: 3.0.0
info:
  title: IATI SuiteCRM Message Queue Usage
  version: 0.0.1
  description: Specification of how the IATI CRM pushes messages to the Dashbaord and Data Getter.

defaultContentType: application/json

servers:
  iati-mq-test-amqp:
    title: IATI Message Queue Service
    summary: IATI Message Queue Service over AMQPS
    description: |
      Shared access keys available in Azure portal. Topic name goes in username, api key in password.
    host: iati-mq-test.servicebus.windows.net
    protocol: amqps
    security:
      - type: apiKey
        in: password

  iati-mq-test-https:
    title: IATI Message Queue Service
    summary: IATI Message Queue Service using Azure's REST HTTP API
    description: |
      Shared access keys available in Azure portal.
    externalDocs:
      url: https://learn.microsoft.com/en-us/rest/api/servicebus/
      description: Azure Reference Docs
    host: iati-mq-test.servicebus.windows.net
    protocol: https
    security:
      - type: http
        scheme: SharedAccessSignatures

channels:
  registry_record_updates:
    title: IATI Registry Data Updates
    summary: The channel were updates to IATI Registry records are sent.
    description: |
      In Azure Service Bus, the channel is the queue name or topic name, in the case of the IATI
      setup topics are used, because they allow pub/sub delivery.
    address: iati-mq-registry-update-topic-test
    messages:
      dataset_updated:
        $ref: './message-schemas.yaml#/components/messages/dataset_updated'
      dataset_deleted:
        $ref: './message-schemas.yaml#/components/messages/dataset_deleted'
      reporting_org_updated:
        $ref: './message-schemas.yaml#/components/messages/reporting_org_updated'
      reporting_org_deleted:
        $ref: './message-schemas.yaml#/components/messages/reporting_org_deleted'

operations:
  send_update:
    action: send
    channel:
      $ref: '#/channels/registry_record_updates'
