---
asyncapi: 3.0.0
info:
  title: IATI Message Queue Consumer Usage
  version: 0.0.4
  description: |
    Specification of how the IATI Dashboard (or other clients) receive update
    messages from SuiteCRM.

defaultContentType: application/json

servers:
  iati-mq-test-amqp:
    title: IATI Message Queue Service
    summary: IATI Message Queue Service over AMQPS
    description: |
      When connecting using a 3rd party AMQPS client, the topic name goes in
      username, api key in password.

      When connecting using the Azure Service Bus Python library, connections
      are made using `Endpoint=sb://` connection strings that are available in
      the Azure portal and which incorporate Shared Access Keys. Go to: Azure
      portal > Service Bus Namespace > Topic > Shared access policies.
    host: iati-mq-test.servicebus.windows.net
    protocol: amqps
    security:
      - type: apiKey
        in: password

  iati-mq-test-https:
    title: IATI Message Queue Service
    summary: IATI Message Queue Service using Azure's REST HTTP API
    description: |
      Shared access keys available in Azure portal.
    externalDocs:
      url: https://learn.microsoft.com/en-us/rest/api/servicebus/
      description: Azure Reference Docs
    host: iati-mq-test.servicebus.windows.net
    protocol: https
    security:
      - type: http
        scheme: SharedAccessSignatures

channels:
  registry_record_changes_dashboard:
    title: IATI Registry Record Changes Delivery Subscription - Dashboard
    summary: |
      A subscription that receives notifications of changes to IATI Registry
      dataset and reporting_org records are sent.
    description: |
      The address above (`iati-mq-registry-changes-sub-dashboard-test`) is an
      Azure Service Bus *subscription* where notifications of changes to
      Registry records will be delivered. Messages received on this subscription
      come from the Service Bus *topic* `iati-mq-registry-changes-topic-test`.
      The general form of the *subscription* name is
      `iati-mq-registry-changes-sub-dashboard-INSTANCE`, where `INSTANCE` is to
      be replaced with one of `test`, `dev`, and `prod`, as per the typical IATI
      server setup. (Currently only `test` is active).
    address: iati-mq-registry-changes-sub-dashboard-test
    messages:
      dataset_created:
        $ref: './message-schemas.yaml#/components/messages/dataset_created'
      dataset_updated:
        $ref: './message-schemas.yaml#/components/messages/dataset_updated'
      dataset_deleted:
        $ref: './message-schemas.yaml#/components/messages/dataset_deleted'
      reporting_org_created:
        $ref: './message-schemas.yaml#/components/messages/reporting_org_created'
      reporting_org_updated:
        $ref: './message-schemas.yaml#/components/messages/reporting_org_updated'
      reporting_org_deleted:
        $ref: './message-schemas.yaml#/components/messages/reporting_org_deleted'

  registry_record_changes_datagetter:
    title: IATI Registry Record Changes Delivery Subscription - Data Getter/Bulk Data Service
    summary: |
      A subscription that receives notifications of changes to IATI Registry
      dataset and reporting_org records are sent.
    description: |
      The address above (`iati-mq-registry-changes-sub-data-getter-test`) is an
      Azure Service Bus *subscription* where notifications of changes to
      Registry records will be delivered. Messages received on this subscription
      come from the Service Bus *topic* `iati-mq-registry-changes-topic-test`.
      The general form of the *subscription* name is
      `iati-mq-registry-changes-sub-data-getter-INSTANCE`, where `INSTANCE` is
      to be replaced with one of `test`, `dev`, and `prod`, as per the typical
      IATI server setup. (Currently only `test` is active).
    address: iati-mq-registry-changes-sub-data-getter-test
    messages:
      dataset_created:
        $ref: './message-schemas.yaml#/components/messages/dataset_created'
      dataset_updated:
        $ref: './message-schemas.yaml#/components/messages/dataset_updated'
      dataset_deleted:
        $ref: './message-schemas.yaml#/components/messages/dataset_deleted'
      reporting_org_created:
        $ref: './message-schemas.yaml#/components/messages/reporting_org_created'
      reporting_org_updated:
        $ref: './message-schemas.yaml#/components/messages/reporting_org_updated'
      reporting_org_deleted:
        $ref: './message-schemas.yaml#/components/messages/reporting_org_deleted'


operations:
  receive_dashboard:
    title: A record change notification received from the Registry.
    description: |
      The operation ID `receive_dashboard` is to uniquely identify operations,
      when a channel supports more than one. It does not need to appear anywhere
      in the message sent.
    action: receive
    channel:
      $ref: '#/channels/registry_record_changes_dashboard'

  receive_datagetter:
    title: A record change notification received from the Registry.
    description: |
      The operation ID `receive_datagetter` is to uniquely identify operations,
      when a channel supports more than one. It does not need to appear anywhere
      in the message sent.
    action: receive
    channel:
      $ref: '#/channels/registry_record_changes_datagetter'
