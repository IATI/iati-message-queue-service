---
asyncapi: 3.0.0
info:
  title: IATI Registry Messaging Spec
  version: 0.0.9
  description: Messaging specification for the SuiteCRM-based IATI Registry.

defaultContentType: application/json

servers:
  iati-mq-test-amqp:
    $ref: 'schemas-servers.yaml#/servers/iati-mq-test-amqp'

  iati-mq-test-https:
    $ref: 'schemas-servers.yaml#/servers/iati-mq-test-https'

channels:
  registry_data_record_changes:
    title: IATI Registry Record Changes
    summary: The topic where notifications of changes to IATI Registry records are sent.
    description: |
      The address above (`iati-mq-registry-changes-topic-test`) is the Azure
      Service Bus *topic* to which the Registry sends notification of changes to
      datasets and reporting orgs. Service Bus delivers messages received to
      this topic to several *subscriptions*. The general form of the *topic*
      name is `iati-mq-registry-changes-topic-INSTANCE`, where `INSTANCE` is to
      be replaced with one of `test`, `dev`, and `prod`, as per the typical IATI
      server setup. (Currently only `test` is active).
    address: iati-mq-registry-changes-topic-test
    messages:
      dataset_created:
        $ref: './schemas-messages.yaml#/components/messages/dataset_created'
      dataset_updated:
        $ref: './schemas-messages.yaml#/components/messages/dataset_updated'
      dataset_deleted:
        $ref: './schemas-messages.yaml#/components/messages/dataset_deleted'
      reporting_org_created:
        $ref: './schemas-messages.yaml#/components/messages/reporting_org_created'
      reporting_org_updated:
        $ref: './schemas-messages.yaml#/components/messages/reporting_org_updated'
      reporting_org_deleted:
        $ref: './schemas-messages.yaml#/components/messages/reporting_org_deleted'

operations:
  registry_changes:
    title: A record change notification sent from the Registry.
    description: |
      The operation ID `registry_changes` is to uniquely identify operations,
      when a channel supports more than one. It does not need to appear anywhere
      in the message sent.
    action: send
    channel:
      $ref: '#/channels/registry_data_record_changes'
