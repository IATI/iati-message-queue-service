---
asyncapi: 3.0.0
info:
  title: IATI Dashboard Messaging Spec
  version: 0.0.12
  description: Messaging specification for the IATI Dashboard

defaultContentType: application/json

servers:
  iati-mq-test-amqp:
    $ref: 'schemas-servers.yaml#/servers/iati-mq-test-amqp'

  iati-mq-test-https:
    $ref: 'schemas-servers.yaml#/servers/iati-mq-test-https'

channels:
  registry_data_record_changes:
    title: IATI Registry Data Record Changes Subscription
    description: |
      > A subscription that receives notifications of changes to IATI Registry
      data (dataset and reporting_org) records are sent.

      The address above (`iati-mq-registry-changes-sub-dashboard-test`) is an
      Azure Service Bus *subscription* where notifications of changes to
      Registry records will be delivered. Messages received on this subscription
      come from the Service Bus *topic* `iati-mq-registry-changes-topic-test`.

      The general form of the *subscription* name is
      `iati-mq-registry-changes-sub-dashboard-INSTANCE`, where `INSTANCE` is to
      be replaced with one of `test`, `dev`, and `prod`, as per the typical IATI
      server setup. (Currently only `test` is active).
    address: iati-mq-registry-changes-sub-dashboard-test
    messages:
      dataset_created:
        $ref: './schemas-messages.yaml#/components/messages/dataset_created'
      dataset_updated:
        $ref: './schemas-messages.yaml#/components/messages/dataset_updated'
      dataset_deleted:
        $ref: './schemas-messages.yaml#/components/messages/dataset_deleted'
      reporting_org_created:
        $ref: './schemas-messages.yaml#/components/messages/reporting_org_created'
      reporting_org_updated:
        $ref: './schemas-messages.yaml#/components/messages/reporting_org_updated'
      reporting_org_deleted:
        $ref: './schemas-messages.yaml#/components/messages/reporting_org_deleted'

  dataset_check_results:
    title: Dataset download check results from the Bulk Data Service.
    description: |
      > A subscription that receives notifications of Bulk Data Service dataset
      check operations and the results of the check.

      The Bulk Data Service dataset checks always involve issuing a
      `HEAD` request for the dataset, but only if needed will a `GET` request be
      made, so these dataset check records may indicate the dataset has been
      re-downloaded or may indicate that a `HEAD` request has confirmed the
      dataset is unchanged.

      The `dataset_check_result` property of the message payload is the
      complete Bulk Data Service record for the given dataset (as included in
      the Bulk Data Service's Full Index).

      The address above (`iati-mq-dataset-check-results-sub-dashboard`) is an
      Azure Service Bus *subscription* where notifications of download checks
      from the Bulk Data Service will be received. Messages received on this
      subscription come from the Service Bus *topic*
      `iati-mq-dataset-check-results-topic`.

      The general form of the *subscription* name is
      `iati-mq-dataset-check-results-sub-dashboard-INSTANCE`, where `INSTANCE`
      is to be replaced with one of `test`, `dev`, and `prod`, as per the
      typical IATI server setup.
    address: iati-mq-dataset-check-results-sub-dashboard
    messages:
      dataset_check_result:
        $ref: './schemas-messages.yaml#/components/messages/dataset_check_result'

operations:
  registry_changes:
    title: Data record change notifications from the IATI Registry.
    description: |
      The operation ID `registry_changes` is to uniquely identify operations,
      when a channel supports more than one. It does not need to appear anywhere
      in the message sent.
    action: receive
    channel:
      $ref: '#/channels/registry_data_record_changes'

  dataset_check_results:
    title: Dataset download check results from the IATI Bulk Data Service.
    description: |
      The operation ID `dataset_check_results` is to uniquely identify
      operations, when a channel supports more than one. It does not need to
      appear anywhere in the message sent.
    action: receive
    channel:
      $ref: '#/channels/dataset_check_results'
