---
asyncapi: 3.0.0
info:
  title: IATI Internal Message Queue Service Common Components - Messages
  version: 0.0.9
  description: |
    Definition of messages needed by apps using the IATI internal message queue
    service.

defaultContentType: application/json

components:
  messages:
    dataset_created:
      name: dataset_created
      title: Notification that a dataset has been created.
      summary: |
        Message indicating that a dataset record has been deleted on the
        Registry. The `message_id` in this spec serves to identify the
        message type is not itself part of the message, but this message must
        contain an application header called `message_type` that contains the
        `DATASET_CREATED` in uppercase.
      headers:
        type: object
        properties:
          message_type:
            type: string
            const: "DATASET_CREATED"
            description: |
              This is set as a key/value pair as the custom application headers
              (in the Azure library it's the `application_properties`
              parameter).
      payload:
        type: object
        required:
          - message_type
          - message_date
          - dataset
          - dataset_action
        properties:
          message_type:
            type: string
            const: "DATASET_CREATED"
          message_date:
            type: string
            format: date-time
            example: 2025-06-27T06:54:20+00:00
          dataset:
            $ref: "#/components/schemas/dataset"
          dataset_action:
            $ref: "#/components/schemas/dataset_action"

    dataset_updated:
      name: dataset_updated
      title: Notification that a dataset has been updated.
      summary: |
        Message indicating that a dataset record has been deleted on the
        Registry. The `message_id` in this spec serves to identify the
        message type is not itself part of the message, but this message must
        contain an application header called `message_type` that contains the
        `DATASET_UPDATED` in uppercase.
      headers:
        type: object
        properties:
          message_type:
            type: string
            const: "DATASET_UPDATED"
            description: |
              This is set as a key/value pair as the custom application headers
              (in the Azure library it's the `application_properties`
              parameter).
      payload:
        type: object
        required:
          - message_type
          - message_date
          - dataset
          - dataset_action
        properties:
          message_type:
            type: string
            const: "DATASET_UPDATED"
          message_date:
            type: string
            format: date-time
            example: 2025-06-27T06:54:20+00:00
          dataset:
            $ref: "#/components/schemas/dataset"
          dataset_action:
            $ref: "#/components/schemas/dataset_action"

    dataset_deleted:
      name: dataset_deleted
      title: Notification that a dataset has been deleted.
      summary: |
        Message indicating that a dataset record has been deleted on the
        Registry. The `message_id` in this spec serves to identify the
        message type is not itself part of the message, but this message must
        contain an application header called `message_type` that contains the
        `DATASET_DELETED` in uppercase.
      headers:
        type: object
        properties:
          message_type:
            type: string
            const: "DATASET_DELETED"
            description: |
              This is set as a key/value pair as the custom application headers
              (in the Azure library it's the `application_properties`
              parameter).
      payload:
        type: object
        required:
          - message_type
          - message_date
          - dataset
          - dataset_action
        properties:
          message_type:
            type: string
            const: "DATASET_DELETED"
          message_date:
            type: string
            format: date-time
            example: 2025-06-27T06:54:20+00:00
          dataset:
            type: object
            required:
              - id
            properties:
              id:
                type: string
                format: uuid
                example: 5401c7f4-e9fd-4ce3-b184-bfe1cb71a9f8
          dataset_action:
            $ref: "#/components/schemas/dataset_action"

    reporting_org_created:
      name: reporting_org_created
      title: Notification that a reporting org has been created.
      summary: |
        Message indicating that a dataset record has been deleted on the
        Registry. The `message_id` in this spec serves to identify the
        message type is not itself part of the message, but this message must
