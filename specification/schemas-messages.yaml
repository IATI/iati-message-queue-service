          type: string
          format: uuid
          example: 22d82ca0-67de-11f0-90a9-a7bd7f82882f
        short_name:
          type: string
          example: aidagcy-activity-3
        dataset_download_details:
          $ref: "#/components/schemas/dataset_download_details"
        get_attempt_result:
          $ref: "#/components/schemas/dataset_get_request_attempt_result"
