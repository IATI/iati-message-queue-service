        An message which details the results of a Bulk Data Service check
        operation on the dataset.
      type: object
      required:
        - id
        - short_name
      properties:
        id:
          type: string
          format: uuid
          example: 22d82ca0-67de-11f0-90a9-a7bd7f82882f
        short_name:
          type: string
          example: aidagcy-activity-3
        reporting_org_id:
          type: string
          format: uuid
          example: de576bb9-5f2b-4d43-a570-53ab3b8bb9b8
        reporting_org_short_name:
          type: string
          example: aidagcy
        licence_id:
          type: string
        source_url:
          type: string
          format: url
          example: https://www.example.com/files/aidagcy/aidagcy-activity-file.xml
        last_update_check:
          description: |
            This field is updated every time the Bulk Data Service checks the
            dataset, regardless of whether a full download was attempted and
