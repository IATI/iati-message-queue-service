---
name: Auto-generate HTML documentation

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths: [specification/**]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generating HTML for the IATI Registry Spec
        uses: asyncapi/cli@v3.2.0
        with:
          template: "@asyncapi/html-template@3.0.0"  # As its a template from npm with a @ it must be in quotes
          parameters: --use-new-generator --force-write
          filepath: specification/iati-registry.yaml
          output: docs/spec-iati-registry

      - name: Generating HTML for the IATI Dashboard Spec
        uses: asyncapi/cli@v3.2.0
        with:
          template: "@asyncapi/html-template@3.0.0"  # As its a template from npm with a @ it must be in quotes
          parameters: --use-new-generator --force-write
          filepath: specification/iati-dashboard.yaml
          output: docs/spec-iati-dashboard

      - name: Generating HTML for the IATI Bulk Data Service Spec
        uses: asyncapi/cli@v3.2.0
        with:
          template: "@asyncapi/html-template@3.0.0"  # As its a template from npm with a @ it must be in quotes
          parameters: --use-new-generator --force-write
          filepath: specification/iati-bulk-data-service.yaml
          output: docs/spec-iati-bulk-data-service

      - name: Generating HTML for the IATI Data Downloader Spec
        uses: asyncapi/cli@v3.2.0
        with:
          template: "@asyncapi/html-template@3.0.0"  # As its a template from npm with a @ it must be in quotes
          parameters: --use-new-generator --force-write
          filepath: specification/iati-data-downloader.yaml
          output: docs/spec-iati-data-downloader

      - name: Commit and push documentation changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add docs
          git commit -m 'docs: HTML auto-generated after spec update'
          git push
